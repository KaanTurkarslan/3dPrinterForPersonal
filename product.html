<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ürün Detayı — CustomShape3D</title>
  <meta name="description" content="Ürün özelliklerini ayarlayın, 3D önizleyin ve sipariş verin." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    :root {
      --void: #0A0C10;
      --slate-900: #0F1117;
      --slate-800: #161B27;
      --slate-700: #1C2333;
      --snow: #E2E8F0;
      --muted: #64748B;
      --border: rgba(255,255,255,0.07);
      --accent: #7BAAF7;
      --f-display: 'Inter', sans-serif;
      --f-mono: 'JetBrains Mono', monospace;
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    body {
      background: var(--void);
      color: var(--snow);
      font-family: var(--f-display);
      min-height: 100vh;
    }

    /* ── Navbar ── */
    .pnav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,12,16,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .pnav-logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 1rem; color: var(--snow);
      text-decoration: none;
    }
    .pnav-logo-icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, #3D5278, #5B7AB0);
      display: flex; align-items: center; justify-content: center;
    }
    .pnav-logo-accent { color: #7BAAF7; }
    .pnav-back {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.83rem; color: var(--muted);
      text-decoration: none; transition: color 0.2s;
    }
    .pnav-back:hover { color: var(--snow); }

    /* ── Layout ── */
    .product-page { max-width: 1280px; margin: 0 auto; padding: 36px 24px 80px; }
    .product-layout {
      display: grid;
      grid-template-columns: 1fr 440px;
      gap: 36px;
      align-items: start;
    }

    /* ── 3D Viewer Column ── */
    .product-viewer-col { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 16px; }
    .product-canvas-wrap {
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #060810;
      aspect-ratio: 1/1;
      position: relative;
    }
    /* Vignette overlay */
    .product-canvas-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%,
        transparent 45%,
        rgba(4,5,12,0.45) 80%,
        rgba(3,4,10,0.75) 100%
      );
      pointer-events: none;
      z-index: 2;
    }
    .product-canvas-wrap canvas {
      width: 100% !important; height: 100% !important;
      display: block; cursor: grab;
    }
    .product-canvas-wrap canvas:active { cursor: grabbing; }
    .product-canvas-controls {
      position: absolute; top: 12px; right: 12px;
      display: flex; gap: 8px;
    }
    .canvas-ctrl-btn {
      padding: 6px 12px;
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      color: var(--muted);
      font-size: 0.7rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .canvas-ctrl-btn:hover, .canvas-ctrl-btn.active {
      border-color: rgba(123,170,247,0.4);
      color: #7BAAF7;
      background: rgba(123,170,247,0.08);
    }
    .product-color-strip {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(22,27,39,0.7);
      align-items: center;
    }
    .product-color-label { font-size: 0.75rem; color: var(--muted); margin-right: 6px; flex-shrink: 0; }
    .product-color-swatch {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .product-color-swatch:hover { transform: scale(1.2); }
    .product-color-swatch.active {
      border-color: #fff; transform: scale(1.18);
      box-shadow: 0 0 12px rgba(255,255,255,0.35);
    }
    .product-color-name {
      margin-left: auto;
      font-size: 0.75rem; font-family: var(--f-mono);
      color: var(--snow);
    }

    /* ── Config Column ── */
    .product-config-col { display: flex; flex-direction: column; gap: 20px; }

    .product-title-area { margin-bottom: 4px; }
    .product-badge {
      display: inline-flex; align-items: center;
      padding: 4px 12px; border-radius: 100px;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; margin-bottom: 12px;
    }
    .product-name {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 800; color: var(--snow);
      line-height: 1.2; margin-bottom: 8px;
    }
    .product-subtitle { font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; }
    .product-rating {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.83rem;
    }
    .product-stars { font-size: 0.9rem; color: #F59E0B; }
    .product-rating-val { font-weight: 700; color: var(--snow); }
    .product-rating-count { color: var(--muted); }
    .product-dims {
      font-size: 0.75rem; font-family: var(--f-mono);
      color: var(--muted); margin-left: 10px;
    }

    /* Config Block */
    .config-block {
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(22,27,39,0.7);
      padding: 20px;
    }
    .config-block-title {
      font-size: 0.75rem; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 14px;
    }

    /* Material chips */
    .mat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mat-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: var(--muted); font-size: 0.8rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s; text-align: left;
    }
    .mat-btn:hover { border-color: rgba(255,255,255,0.18); color: var(--snow); background: rgba(255,255,255,0.06); }
    .mat-btn.active {
      border-color: rgba(123,170,247,0.45);
      background: rgba(123,170,247,0.08);
      color: #7BAAF7; font-weight: 600;
    }
    .mat-btn-icon { font-size: 1.1rem; flex-shrink: 0; }
    .mat-btn-info { display: flex; flex-direction: column; gap: 1px; }
    .mat-btn-name { font-size: 0.82rem; font-weight: 600; }
    .mat-btn-temp { font-size: 0.68rem; font-family: var(--f-mono); opacity: 0.6; }
    .mat-desc-text {
      font-size: 0.75rem; color: var(--muted); font-style: italic;
      margin-top: 10px; min-height: 1.2em; transition: opacity 0.3s;
    }

    /* Quality */
    .qual-grid { display: flex; gap: 6px; }
    .qual-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 10px 6px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.02);
      color: var(--muted); font-size: 0.7rem; cursor: pointer; transition: all 0.22s;
      text-align: center;
    }
    .qual-btn:hover { border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); }
    .qual-btn.active {
      border-color: rgba(123,170,247,0.45);
      background: rgba(123,170,247,0.08);
      color: #7BAAF7;
    }
    .qual-btn-icon { font-size: 1rem; }
    .qual-btn-name { font-weight: 700; font-size: 0.75rem; color: var(--snow); }
    .qual-btn-layer { font-family: var(--f-mono); font-size: 0.62rem; }

    /* Quantity */
    .qty-row { display: flex; align-items: center; gap: 12px; }
    .qty-btn {
      width: 36px; height: 36px; border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: var(--snow); font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; flex-shrink: 0;
    }
    .qty-btn:hover { border-color: rgba(123,170,247,0.4); background: rgba(123,170,247,0.08); }
    .qty-val {
      font-family: var(--f-mono); font-size: 1.1rem;
      font-weight: 700; color: var(--snow);
      min-width: 32px; text-align: center;
    }

    /* Price Breakdown */
    .price-breakdown {
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(10,12,16,0.6);
      padding: 16px;
    }
    .pb-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
    .pb-label { font-size: 0.78rem; color: var(--muted); }
    .pb-val { font-size: 0.78rem; color: var(--snow); font-weight: 500; }
    .pb-divider { height: 1px; background: var(--border); margin: 8px 0; }
    .pb-total { display: flex; justify-content: space-between; align-items: center; }
    .pb-total-label { font-size: 0.9rem; font-weight: 700; color: var(--snow); }
    .pb-total-val { font-size: 1.5rem; font-weight: 800; color: #7BAAF7; font-family: var(--f-mono); }

    /* CTA */
    .product-cta-row { display: flex; gap: 10px; }
    .btn-order {
      flex: 1; padding: 15px 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3D5278, #5B7AB0);
      color: #fff; font-size: 0.95rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; transition: all 0.25s var(--ease-smooth);
      border: none;
    }
    .btn-order:hover {
      background: linear-gradient(135deg, #4A628A, #6B8CC0);
      box-shadow: 0 8px 24px rgba(91,141,239,0.35);
      transform: translateY(-2px);
    }
    .btn-cart {
      padding: 15px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: var(--muted); font-size: 0.95rem;
      cursor: pointer; transition: all 0.25s;
    }
    .btn-cart:hover { border-color: rgba(123,170,247,0.35); color: #7BAAF7; background: rgba(123,170,247,0.06); }

    /* Specs table */
    .specs-table { display: flex; flex-direction: column; gap: 0; }
    .spec-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .spec-row:last-child { border-bottom: none; }
    .spec-key { font-size: 0.8rem; color: var(--muted); }
    .spec-val { font-size: 0.8rem; font-weight: 600; color: var(--snow); font-family: var(--f-mono); }

    /* Toast */
    #toast-container {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column; align-items: center;
      gap: 10px; pointer-events: none;
    }
    .product-toast {
      padding: 12px 22px; border-radius: 12px;
      background: rgba(22,27,39,0.95); border: 1px solid rgba(123,170,247,0.25);
      backdrop-filter: blur(16px); color: var(--snow);
      font-size: 0.875rem; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      white-space: nowrap; transform: translateY(16px); opacity: 0;
      transition: transform 0.3s var(--ease-spring), opacity 0.3s;
    }
    .product-toast.show { transform: translateY(0); opacity: 1; }

    /* Not found */
    .product-not-found {
      text-align: center; padding: 120px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .product-layout { grid-template-columns: 1fr; }
      .product-viewer-col { position: static; }
      .product-canvas-wrap { aspect-ratio: 4/3; }
    }
    @media (max-width: 480px) {
      .product-page { padding: 20px 16px 60px; }
      .mat-grid { grid-template-columns: 1fr; }
      .qual-grid { flex-wrap: wrap; }
      .qual-btn { min-width: 70px; }
    }
  </style>
</head>

  <nav class="pnav">

        </svg>
      </div>
      Custom<span class="pnav-logo-accent">Shape3D</span>
    </a>
    <div style="display: flex; align-items: center; gap: 16px;">
      <button class="nav-cart-btn" id="nav-cart" style="position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; transition: all 0.25s; cursor: pointer;">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <span class="nav-cart-badge" id="nav-cart-badge" style="display:none; position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #7BAAF7, #8B5CF6); color: #fff; font-size: 0.62rem; font-weight: 700; align-items: center; justify-content: center;">0</span>
      </button>
      <a href="index.html" class="pnav-back">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

        </svg>
        Mağazaya Dön
      </a>
    </div>
  </nav>

  <div class="product-page" id="product-page">
    <div class="product-not-found" id="not-found" style="display:none;">
      <svg width="64" height="64" fill="none" stroke="#64748B" stroke-width="1.5" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <p style="color:var(--muted);font-size:1.1rem;">Ürün bulunamadı.</p>
      <a href="/" style="color:#7BAAF7;font-size:0.9rem;">← Mağazaya Dön</a>
    </div>
    <div class="product-layout" id="product-layout" style="display:none;">
      <!-- 3D Viewer Column -->
      <div class="product-viewer-col">
        <div class="product-canvas-wrap" id="product-canvas-wrap">
          <canvas id="product-canvas"></canvas>
          <div class="product-canvas-controls">
            <button class="canvas-ctrl-btn active" id="ctrl-rotate">↺ Oto</button>
            <button class="canvas-ctrl-btn" id="ctrl-reset">⊞ Sıfırla</button>
          </div>
        </div>
        <!-- Color strip -->
        <div class="product-color-strip" id="color-strip">
          <span class="product-color-label">Renk:</span>
          <div id="color-swatches" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
          <span class="product-color-name" id="selected-color-name">—</span>
        </div>
      </div>

      <!-- Config Column -->
      <div class="product-config-col">
        <!-- Title area -->
        <div class="product-title-area">
          <div class="product-badge" id="product-badge"></div>
          <h1 class="product-name" id="product-name"></h1>
          <p class="product-subtitle" id="product-subtitle"></p>
          <div class="product-rating">
            <span class="product-stars" id="product-stars"></span>
            <span class="product-rating-val" id="product-rating-val"></span>
            <span class="product-rating-count" id="product-rating-count"></span>
            <span class="product-dims" id="product-dims"></span>
          </div>
        </div>

        <!-- Description & Source Link -->
        <div class="config-block" id="description-block" style="display:none;">
          <div class="config-block-title">📝 Tasarım Açıklaması</div>
          <p id="product-description" style="font-size: 0.85rem; line-height: 1.6; color: var(--snow); margin-bottom: 14px;"></p>
          <a id="product-source-link" href="#" target="_blank" style="display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: #7BAAF7; text-decoration: none; font-weight: 600;">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
            </svg>
            Printables.com Üzerinde Görüntüle
          </a>
        </div>

        <!-- Material -->
        <div class="config-block">
          <div class="config-block-title">🧪 Filament Malzeme</div>
          <div class="mat-grid" id="mat-grid"></div>
          <div class="mat-desc-text" id="mat-desc-text"></div>
        </div>

        <!-- Quality -->
        <div class="config-block">
          <div class="config-block-title">🎯 Baskı Kalitesi</div>
          <div class="qual-grid" id="qual-grid"></div>
        </div>

        <!-- Quantity -->
        <div class="config-block">
          <div class="config-block-title">📦 Adet</div>
          <div class="qty-row">
            <button class="qty-btn" id="qty-minus">−</button>
            <span class="qty-val" id="qty-val">1</span>
            <button class="qty-btn" id="qty-plus">+</button>
          </div>
        </div>

        <!-- Price Breakdown -->
        <div class="price-breakdown" id="price-breakdown">
          <div class="pb-row">
            <span class="pb-label">Baz Fiyat</span>
            <span class="pb-val" id="pb-base">—</span>

          <div class="pb-row">
            <span class="pb-label">Malzeme Katsayısı</span>
            <span class="pb-val" id="pb-mat">—</span>
          </div>
          <div class="pb-row">
            <span class="pb-label">Kalite Katsayısı</span>
            <span class="pb-val" id="pb-qual">—</span>

            <span class="pb-label">Adet</span>

          </div>

            <span class="pb-total-val" id="pb-total">₺0</span>
          </div>

        <!-- CTA -->
        <div class="product-cta-row">
          <button class="btn-order" id="btn-order">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
            Sipariş Ver
          </button>
          <button class="btn-cart" id="btn-cart" title="Sepete Ekle">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
            </svg>
          </button>
        </div>

        <!-- Specs -->
        <div class="config-block">
          <div class="config-block-title">📋 Teknik Özellikler</div>
          <div class="specs-table" id="specs-table"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import {
      PRODUCTS,
      MATERIALS_DB,
      QUALITIES_DB,
      buildCustomUpload,
      buildDroneFrame,
      buildGearSet,
      buildPhoneStand,
      buildCableOrganizer,
      buildMiniHouse,
      buildRobotJoint,
      buildHeadphoneStand,
      buildPlanter,
      buildFidgetSpinner,
      buildGoProMount,
      buildHexStorage
    } from './src/js/shop.js';
    import { initCart, addProductToCart } from './src/js/cart.js';

    // Force scroll to top on page load/refresh
    if ('scrollRestoration' in history) {
       history.scrollRestoration = 'manual';
    }
    window.scrollTo(0, 0);

    window.addEventListener('load', () => {
      setTimeout(() => {
        window.scrollTo(0, 0);
      }, 30);
    });

    // ── Init ─────────────────────────────────────────────
    initCart();

    const params = new URLSearchParams(location.search);
    const productId = params.get('id');
    const product = PRODUCTS.find(p => p.id === productId);

    if (!product) {
      document.getElementById('not-found').style.display = 'flex';
    } else {
      document.title = `${product.name} — CustomShape3D`;
      document.getElementById('product-layout').style.display = 'grid';
      initProductPage(product);
    }

    function initProductPage(p) {
      // Description & Source Link block
      const descBlock = document.getElementById('description-block');
      if (p.id === 'custom-upload') {
        descBlock.style.display = 'none';
      } else {
        descBlock.style.display = 'block';
        document.getElementById('product-description').textContent = p.description || '';
        document.getElementById('product-source-link').setAttribute('href', p.printablesUrl || '#');
      }

      // Fill title area
      const badge = document.getElementById('product-badge');
      badge.textContent = p.badge;
      badge.style.background = p.badgeColor + '22';
      badge.style.color = p.badgeColor;
      badge.style.border = `1px solid ${p.badgeColor}44`;

      document.getElementById('product-name').textContent = p.name;
      document.getElementById('product-subtitle').textContent = p.subtitle;
      const stars = '★'.repeat(Math.floor(p.rating)) + (p.rating % 1 >= 0.5 ? '½' : '');
      document.getElementById('product-stars').textContent = stars;
      document.getElementById('product-rating-val').textContent = p.rating;
      document.getElementById('product-rating-count').textContent = `(${p.reviews} değerlendirme)`;
      document.getElementById('product-dims').textContent = `📐 ${p.dims}`;

      // State
      let selMat  = p.defaultMaterial;
      let selQual = p.defaultQuality;
      let selHex  = p.colors[0].hex;
      let qty     = 1;

      // Color swatches
      const swatchContainer = document.getElementById('color-swatches');
      p.colors.forEach((c, i) => {
        const btn = document.createElement('button');
        btn.className = 'product-color-swatch' + (i === 0 ? ' active' : '');
        btn.style.background = c.hex;
        btn.title = c.name;
        btn.addEventListener('click', () => {
          swatchContainer.querySelectorAll('.product-color-swatch').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selHex = c.hex;
          document.getElementById('selected-color-name').textContent = c.name;
          updateModelColor(c.hex);
        });
        swatchContainer.appendChild(btn);
      });
      document.getElementById('selected-color-name').textContent = p.colors[0].name;

      // Material buttons
      const matGrid = document.getElementById('mat-grid');
      p.availableMaterials.forEach(mid => {
        const m = MATERIALS_DB[mid];
        const btn = document.createElement('button');
        btn.className = 'mat-btn' + (mid === selMat ? ' active' : '');
        btn.innerHTML = `<span class="mat-btn-icon">${m.icon}</span>
          <div class="mat-btn-info">
            <span class="mat-btn-name">${m.name}</span>
            <span class="mat-btn-temp">${m.temp}</span>
          </div>`;
        btn.addEventListener('click', () => {
          matGrid.querySelectorAll('.mat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selMat = mid;
          document.getElementById('mat-desc-text').textContent = m.desc;
          recalcPrice();
        });
        matGrid.appendChild(btn);
      });
      document.getElementById('mat-desc-text').textContent = MATERIALS_DB[selMat].desc;

      // Quality buttons
      const qualGrid = document.getElementById('qual-grid');
      QUALITIES_DB.forEach(q => {
        const btn = document.createElement('button');
        btn.className = 'qual-btn' + (q.id === selQual ? ' active' : '');
        btn.innerHTML = `<span class="qual-btn-icon">${q.icon}</span>
          <span class="qual-btn-name">${q.name}</span>
          <span class="qual-btn-layer">${q.layer}</span>`;
        btn.addEventListener('click', () => {
          qualGrid.querySelectorAll('.qual-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selQual = q.id;
          recalcPrice();
        });
        qualGrid.appendChild(btn);
      });

      // Quantity
      document.getElementById('qty-minus').addEventListener('click', () => {
        if (qty > 1) { qty--; document.getElementById('qty-val').textContent = qty; recalcPrice(); }
      });
      document.getElementById('qty-plus').addEventListener('click', () => {
        if (qty < 99) { qty++; document.getElementById('qty-val').textContent = qty; recalcPrice(); }
      });

      function recalcPrice() {
        const mat  = MATERIALS_DB[selMat];
        const qual = QUALITIES_DB.find(q => q.id === selQual);
        const unitPrice = Math.round(p.price * mat.mult * qual.mult);
        const total = unitPrice * qty;
        document.getElementById('pb-base').textContent  = `₺${p.price}`;
        document.getElementById('pb-mat').textContent   = `×${mat.mult.toFixed(2)} (${mat.name})`;
        document.getElementById('pb-qual').textContent  = `×${qual.mult.toFixed(2)} (${qual.name})`;
        document.getElementById('pb-qty').textContent   = `×${qty}`;
        document.getElementById('pb-total').textContent = `₺${total.toLocaleString('tr-TR')}`;
      }
      recalcPrice();

      // Specs
      const specRows = [
        ['Boyutlar', p.dims],
        ['Kategori', p.category === 'mekanik' ? '⚙️ Mekanik' : p.category === 'dekor' ? '🏠 Dekor' : '🎒 Aksesuar'],
        ['Mevcut Malzemeler', p.availableMaterials.map(m => MATERIALS_DB[m].name).join(', ')],
        ['Değerlendirme', `${p.rating} / 5.0 (${p.reviews} yorum)`],
        ['Minimum Katman', '0.05mm (Ultra kalitede)'],
        ['Teslimat', 'Aynı gün kargo (16:00\'a kadar)'],
      ];
      const specsTable = document.getElementById('specs-table');
      specRows.forEach(([key, val]) => {
        const row = document.createElement('div');
        row.className = 'spec-row';
        row.innerHTML = `<span class="spec-key">${key}</span><span class="spec-val">${val}</span>`;
        specsTable.appendChild(row);
      });

      // CTA buttons
      document.getElementById('btn-order').addEventListener('click', () => {
        const mat = MATERIALS_DB[selMat];
        const qual = QUALITIES_DB.find(q => q.id === selQual);
        const unitPrice = Math.round(p.price * mat.mult * qual.mult);
        
        const item = {
          id: p.id,
          name: p.name,
          color: {
            name: p.colors.find(c => c.hex === selHex)?.name || 'Renk',
            hex: selHex
          },
          material: {
            id: selMat,
            name: mat.name
          },
          quality: {
            id: selQual,
            name: qual.name
          },
          qty: qty,
          unitPrice: unitPrice,
          total: unitPrice * qty
        };
        
        addProductToCart(item);
        // Open checkout modal directly
        document.getElementById('cart-close-btn').click();
        document.getElementById('cart-checkout-btn').click();
      });

      document.getElementById('btn-cart').addEventListener('click', () => {
        const mat = MATERIALS_DB[selMat];
        const qual = QUALITIES_DB.find(q => q.id === selQual);
        const unitPrice = Math.round(p.price * mat.mult * qual.mult);
        
        const item = {
          id: p.id,
          name: p.name,
          color: {
            name: p.colors.find(c => c.hex === selHex)?.name || 'Renk',
            hex: selHex
          },
          material: {
            id: selMat,
            name: mat.name
          },
          quality: {
            id: selQual,
            name: qual.name
          },
          qty: qty,
          unitPrice: unitPrice,
          total: unitPrice * qty
        };
        
        addProductToCart(item);
      });

      // Viewport Handling
      const canvas = document.getElementById('product-canvas');
      const controls = document.querySelector('.product-canvas-controls');
      const wrap = document.getElementById('product-canvas-wrap');

      if (p.id === 'custom-upload') {
        canvas.style.display = 'block';
        if (controls) controls.style.display = 'flex';
        initScene(p, () => selHex);
      } else {
        canvas.style.display = 'none';
        if (controls) controls.style.display = 'none';

        let existingImg = wrap.querySelector('.product-preview-img');
        if (existingImg) existingImg.remove();

        const img = document.createElement('img');
        img.className = 'product-preview-img';
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';
        img.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
        img.src = p.thumbnail;

        wrap.style.cursor = 'zoom-in';
        wrap.addEventListener('mouseenter', () => { img.style.transform = 'scale(1.08)'; });
        wrap.addEventListener('mouseleave', () => { img.style.transform = 'scale(1)'; });

        wrap.appendChild(img);
      }
    }

    // ── 3D Scene ─────────────────────────────────────────
    let sceneRef = null;

    function initScene(p, getHex) {
      const canvas = document.getElementById('product-canvas');
      const wrap   = document.getElementById('product-canvas-wrap');

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0a);

      const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 200);
      camera.position.set(0, 1.5, 6);
      camera.lookAt(0, 0, 0);

      // renderer.setSize'i updateStyle=false ile çağırıyoruz —
      // CSS width/height'ı biz kontrol ediyoruz
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      // Three.js r155+ için linear color output
      renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

      // Canvas CSS'i Three.js'in üzerine yazmasını engellemek için
      // setSize'ı false parametresiyle çağırıyoruz (updateStyle=false)
      function resize() {
        const w = wrap.offsetWidth;
        const h = wrap.offsetHeight;
        if (!w || !h) return; // layout hazır değil, atla
        renderer.setSize(w, h, false); // false = CSS style'ı değiştirme
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }

      // Layout display:none'dan grid'e geçiş için RAF ile bekle
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          resize();
          new ResizeObserver(resize).observe(wrap);
        });
      });

      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.2;
      controls.target.set(0, 0, 0);
      controls.update();

      // ── Soft Studio Işıklandırma (Three.js r168 uyumlu) ──
      // Güçlü ambient — modelin her yüzeyi görünsün
      scene.add(new THREE.AmbientLight(0xffffff, 1.8));

      // Ana key ışık — sol üstten, sıcak beyaz
      const keyLight = new THREE.DirectionalLight(0xfff8f0, 3.5);
      keyLight.position.set(4, 8, 6);
      scene.add(keyLight);

      // Dolgu ışık — sağdan hafif
      const fillLight = new THREE.DirectionalLight(0xf0f5ff, 1.5);
      fillLight.position.set(-5, 2, 3);
      scene.add(fillLight);

      // Arka rim ışık — kenar belirteci
      const rimLight = new THREE.DirectionalLight(0xddeeff, 2.0);
      rimLight.position.set(0, 3, -6);
      scene.add(rimLight);

      // Alt kaldırma — gölge sertliğini azaltır
      const bottomLight = new THREE.DirectionalLight(0xffffff, 0.8);
      bottomLight.position.set(0, -5, 1);
      scene.add(bottomLight);

      // ── Zemin ──
      const floorY = -2.0;

      // Yansımalı parlak zemin
      const floorGeo = new THREE.PlaneGeometry(16, 16);
      const floorMat = new THREE.MeshPhongMaterial({
        color: 0x050505,
        shininess: 200,
        specular: 0x333333,
        transparent: true,
        opacity: 0.9,
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = floorY;
      scene.add(floor);

      // Altında parlayan halka
      const glowGeo = new THREE.CircleGeometry(1.6, 64);
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.06,
      });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.rotation.x = -Math.PI / 2;
      glow.position.y = floorY + 0.01;
      scene.add(glow);

      // ── Model ──
      const group = new THREE.Group();
      const col = new THREE.Color(p.colors[0].hex);

      try {
        const buildFn = p.buildFn || buildCustomUpload;
        buildFn(group, col);
      } catch(e) {
        console.error('[3D Viewer] Model inşa hatası:', e);
      }
      scene.add(group);
      sceneRef = { group, col };

      // ── Kontroller ──
      document.getElementById('ctrl-rotate').addEventListener('click', function() {
        controls.autoRotate = !controls.autoRotate;
        this.classList.toggle('active', controls.autoRotate);
        this.textContent = controls.autoRotate ? '↺ Oto' : '⏸ Dur';
      });
      document.getElementById('ctrl-reset').addEventListener('click', () => {
        controls.reset();
        camera.position.set(0, 1.5, 6);
        camera.lookAt(0, 0, 0);
      });

      let t = 0;
      function animate() {
        requestAnimationFrame(animate);
        t += 0.01;
        controls.update();
        glowMat.opacity = 0.05 + Math.sin(t * 0.7) * 0.025;
        renderer.render(scene, camera);
      }
      animate();

    }

    function updateModelColor(hex) {
      if (!sceneRef) return;
      const newCol = new THREE.Color(hex);
      sceneRef.group.traverse(obj => {
        if (obj.isMesh && obj.material) {
          if (Array.isArray(obj.material)) {
            obj.material.forEach(m => { if (m.color) m.color.set(newCol); });
          } else if (obj.material.color) {
            obj.material.color.set(newCol);
          }
        }
      });
    }


    // Toast
    function showToast(msg) {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'product-toast';
      t.textContent = msg;
      c.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => { t.classList.remove('show'); setTimeout(()=>t.remove(),380); }, 4000);
    }
  </script>
</body>
